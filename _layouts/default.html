---
<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <script>
  window.MathJax = {
    tex: {
      inlineMath: [
        ['$', '$'],
        ['\\(', '\\)']
      ],
      displayMath: [
        ['$$', '$$'],
        ['\\[', '\\]']
      ],
      processEscapes: true
    }
  };
</script>

<script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3.0.1/es5/tex-mml-chtml.js">
</script>

    
  </head>
  <body>
    <div class="Margins">
      <p class="LatexTitle"><a href="{{ '/' | relative_url }}">{{ page.title }}</a></p>
      {% if page.author %} <p class="LatexName">{{ page.author }}</p> {% endif %}
      {% if page.date %} <p class="LatexDate">{{ page.date }}</p> {% endif %}
      
      {% if page.abstract %}<div class="AbstractMargins">
        <p class="LatexAbstract">Abstract</p>
        <p class="LatexAbstractText">{{ page.abstract }}</p>
      </div>{% endif %}

      
      {% if page.url == "/" %}
      {{ content }}
      {% else %}
      <div class="markdown-content">
          {{ content }}
      </div>
      {% endif %}


    </div>
  </body>
  <footer class="footerSize">

  </footer>
</html>
